name: Type Check

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --frozen --all-groups
      - run: uv run ty check
