[project]
name = "my-blog"
version = "0.1.0"
description = "Personal experiment blog built with Django - a platform for trying out features and publishing what I discover"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pyright>=1.1.411",
    "pytest-django>=4.14.0",
]
develop = [
    "pylance>=10.0.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["project"]
addopts = "--import-mode=importlib"
DJANGO_SETTINGS_MODULE = "app.settings"

[tool.coverage.run]
omit = [
    "project/tests/*",
    "**/migrations/**"
]
