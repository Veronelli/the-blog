[project]
name = "my-blog"
version = "0.1.0"
description = "Personal experiment blog built with Django - a platform for trying out features and publishing what I discover"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "mypy>=2.3.0",
]
develop = [
    "pylance>=10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["project"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
omit = [
    "project/tests/*",
    "**/migrations/**"
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
mypy_path = "project"
strict_optional = true

[[tool.mypy.overrides]]
module = "django_stubs_ext"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["profiles.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "app.settings"