<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit social network instance</title>
</head>
<body>
    <h1>{{ instance.config.name }}</h1>
    <form method="post">
        {% csrf_token %}
        {% for variable_instance in instance.variable_instances.all %}
            <label>{{ variable_instance.variable.identifier }}:
                <input type="text" name="value_{{ variable_instance.variable.identifier }}" value="{{ variable_instance.value }}">
            </label>
        {% endfor %}
        <button type="submit">Save</button>
    </form>
    <p><a href="{% url 'profiles:dashboard' %}">Back</a></p>
</body>
</html>
