<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add social network instance</title>
</head>
<body>
    <h1>Add social network instance</h1>
    <form method="post">
        {% csrf_token %}
        <label>Network:
            <select name="config">
                {% for config in configs %}
                    <option value="{{ config.pk }}">{{ config.name }}</option>
                {% endfor %}
            </select>
        </label>
        <button type="submit">Create</button>
    </form>
    <p><a href="{% url 'profiles:dashboard' %}">Back</a></p>
</body>
</html>
